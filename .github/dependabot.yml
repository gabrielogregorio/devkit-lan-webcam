version: 2
updates:
  - package-ecosystem: "github-actions"
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 3
    labels: ["ci", "dependencies"]
    commit-message:
      prefix: "Bump"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 3
    labels: ["dependencies"]
    commit-message:
      prefix: "Bump"
