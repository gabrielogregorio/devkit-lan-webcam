name: 'Setup Environment'
description: 'Creates the Python venv from the locked requirements, sets up Node from .nvmrc with the locked pnpm packages and, optionally, Playwright for the E2E'
inputs:
  e2e:
    description: 'Also install Playwright + Chromium and generate a throwaway HTTPS certificate'
    default: 'false'
runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: '.nvmrc'

    - name: pnpm packages (versions and hashes from pnpm-lock.yaml)
      shell: bash
      run: |
        corepack enable
        pnpm install --frozen-lockfile

    - name: Python venv (system python3, locked versions and hashes)
      shell: bash
      run: |
        python3 -m venv .venv
        # No pip upgrade: that would fetch whatever pip is newest, without a hash.
        .venv/bin/pip install --quiet --require-hashes -r requirements-dev.txt
        .venv/bin/python --version
        node --version

    - name: Playwright and certificate
      if: ${{ inputs.e2e == 'true' }}
      shell: bash
      run: |
        pnpm exec playwright install --with-deps chromium-headless-shell
        openssl req -x509 -newkey rsa:2048 -nodes -keyout key.pem -out cert.pem -days 1 -subj "/CN=lan-webcam" 2> /dev/null
