name: check lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff + shellcheck + web)
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment

      - name: Ruff (version from uv.lock)
        run: .venv/bin/ruff check --output-format=github .

      - name: ShellCheck
        run: shellcheck --severity=warning ./*.sh tests/launcher/*.sh

      - name: Web app (prettier, eslint, tsc)
        run: pnpm run format:check && pnpm run lint

      - name: E2E script syntax
        run: for f in tests/e2e/*.mjs; do node --check "$f"; done

      - name: Scripts are executable in git
        run: |
          bad=$(git ls-files -s '*.sh' | awk '$1 != "100755" {print $4}')
          if [[ -n "$bad" ]]; then
            for f in $bad; do echo "::error file=$f::not executable in git: git update-index --chmod=+x $f"; done
            exit 1
          fi

      - name: Actions are pinned to a commit hash
        run: |
          bad=$(grep -rnE '^\s*(- )?uses:\s' .github | grep -vE 'uses:\s+\./' | grep -vE '@[0-9a-f]{40}( |$)' || true)
          if [[ -n "$bad" ]]; then
            echo "$bad" | while IFS=: read -r f l _; do echo "::error file=$f,line=$l::pin this action to a full commit hash (# vX.Y.Z as comment)"; done
            exit 1
          fi

      - name: Workflow files are valid YAML
        run: python3 -c "import sys, yaml; [yaml.safe_load(open(f)) for f in sys.argv[1:]]" .github/workflows/*.yml .github/ISSUE_TEMPLATE/*.yml .github/actions/*/action.yml .github/dependabot.yml

  audit:
    name: Audit dependencies (pip-audit)
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python packages (versions from requirements-dev.txt)
        run: pipx run pip-audit==2.10.1 --no-deps --disable-pip -r requirements-dev.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: npm packages (zero in production, zero high in the tools)
        run: |
          corepack enable
          pnpm audit --prod
          pnpm audit --audit-level high
