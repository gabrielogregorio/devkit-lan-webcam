[project]
name = "devkit-lan-webcam"
version = "1.0.0"
description = "Any camera on the local network becomes a virtual webcam on the PC (Ubuntu): HTTPS/WebSocket server that feeds /dev/video10 through ffmpeg + v4l2loopback"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["server", "conftest"]

[tool.uv]
# "Virtual" project: not an installable package, only scripts (server.py, run.sh).
# uv manages the dependencies only.
package = false
