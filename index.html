<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title data-i18n>LAN Webcam</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: -apple-system, system-ui, sans-serif;
    background: #0b0d12; color: #e6e8ee; display: flex; flex-direction: column;
    min-height: 100vh; align-items: center; padding: 16px; gap: 12px;
  }
  h1 { font-size: 18px; font-weight: 600; margin: 4px 0; }
  #preview {
    width: 100%; max-width: 480px; aspect-ratio: 16/9; background: #000;
    border-radius: 14px; border: 1px solid #1e2230; touch-action: none;
    display: block;
  }
  .panel { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; gap: 8px; width: 100%; }
  button, select {
    flex: 1; padding: 13px 8px; font-size: 15px; border-radius: 12px;
    border: 1px solid #2a2f40; background: #161a26; color: #e6e8ee;
  }
  button.primary { background: #3b82f6; border-color: #3b82f6; color: #fff; font-weight: 600; }
  button.active { background: #1f3a5f; border-color: #3b82f6; }
  button:disabled { opacity: .4; }
  .zoomrow { display: flex; align-items: center; gap: 10px; }
  .zoomrow span { font-size: 13px; color: #8b91a3; min-width: 42px; text-align: right; }
  input[type=range] { flex: 1; accent-color: #3b82f6; height: 28px; }
  #status {
    width: 100%; max-width: 480px; text-align: center; font-size: 14px;
    padding: 10px; border-radius: 10px; background: #161a26;
  }
  .ok { color: #34d399; } .err { color: #f87171; } .warn { color: #fbbf24; }
  .hint { font-size: 12px; color: #8b91a3; max-width: 480px; text-align: center; }
</style>
</head>
<body>
  <h1 data-i18n>📷 Camera → PC webcam</h1>

  <canvas id="preview"></canvas>

  <div class="panel">
    <div class="zoomrow">
      🔍 <input type="range" id="zoom" min="0.3" max="5" step="0.01" value="1">
      <span id="zoomVal">1.0x</span>
    </div>
    <div class="row">
      <button id="mirrorBtn" data-i18n>Mirror</button>
      <button id="rotBtn" data-i18n>Rotate 90°</button>
      <button id="fitBtn" data-i18n>Fit</button>
      <button id="resetBtn" data-i18n>Reset</button>
    </div>
    <div class="row">
      <button id="backBtn" data-i18n>📷 Back</button>
      <button id="frontBtn" data-i18n>🤳 Front</button>
    </div>
    <div class="row">
      <select id="camSel"></select>
    </div>
    <div class="row">
      <button id="startBtn" class="primary" data-i18n>Start streaming</button>
      <button id="stopBtn" disabled data-i18n>Stop</button>
    </div>
  </div>

  <div id="status" data-i18n>Tap "Start streaming"</div>
  <div class="hint" data-i18n-html>On the preview: <b>drag</b> to move • <b>pinch</b> (2 fingers) to zoom. The camera becomes the <b>"LAN Webcam"</b> webcam on the PC. Keep this tab open and the screen on.</div>

<script type="module">
import {
  resetView, toggleMirror, cycleRotation, toggleFit,
  setZoom, zoomFromPinch, panBy, computeDrawParams,
} from './view.js';
import { detectLanguage, translator } from './i18n.js';

const language = detectLanguage(location.search, navigator.languages || [navigator.language]);
const t = translator(language);
document.documentElement.lang = language;
// Static text is English in the HTML itself and doubles as the key.
document.querySelectorAll('[data-i18n]').forEach((element) => {
  element.textContent = t(element.textContent.trim());
});
document.querySelectorAll('[data-i18n-html]').forEach((element) => {
  element.innerHTML = t(element.innerHTML.trim());
});

const previewCanvas = document.getElementById('preview');
const cameraSelect = document.getElementById('camSel');
const startButton = document.getElementById('startBtn');
const stopButton = document.getElementById('stopBtn');
const statusBox = document.getElementById('status');
const zoomSlider = document.getElementById('zoom');
const zoomValueLabel = document.getElementById('zoomVal');
const mirrorButton = document.getElementById('mirrorBtn');
const rotationButton = document.getElementById('rotBtn');
const fitButton = document.getElementById('fitBtn');
const resetButton = document.getElementById('resetBtn');
const backCameraButton = document.getElementById('backBtn');
const frontCameraButton = document.getElementById('frontBtn');

const CANVAS_WIDTH = 1280;
const CANVAS_HEIGHT = 720;
const FPS = 25;
const JPEG_QUALITY = 0.6;
const MAX_BUFFERED_BYTES = 1_000_000;
// Android needs a breather between releasing and reopening the sensor, or it throws NotReadableError.
const CAMERA_RELEASE_DELAY_MS = 150;

previewCanvas.width = CANVAS_WIDTH;
previewCanvas.height = CANVAS_HEIGHT;
const canvasContext = previewCanvas.getContext('2d', { alpha: false });

const videoSource = document.createElement('video');
videoSource.playsInline = true;
videoSource.muted = true;
videoSource.setAttribute('playsinline', '');

let mediaStream = null;
let socket = null;
let sendTimer = null;
let animationFrameId = null;
let streaming = false;
let view = resetView();

function setStatus(message, statusClass = '') {
  statusBox.textContent = message;
  statusBox.className = statusClass;
}

function drawFrame() {
  const videoWidth = videoSource.videoWidth;
  const videoHeight = videoSource.videoHeight;
  canvasContext.fillStyle = '#000';
  canvasContext.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
  if (!videoWidth || !videoHeight) {
    return;
  }
  const drawParams = computeDrawParams(view, videoWidth, videoHeight, CANVAS_WIDTH, CANVAS_HEIGHT);
  canvasContext.save();
  canvasContext.translate(drawParams.translateX, drawParams.translateY);
  canvasContext.rotate((drawParams.rotation * Math.PI) / 180);
  canvasContext.scale(drawParams.mirrorX, 1);
  canvasContext.drawImage(
    videoSource,
    -drawParams.drawWidth / 2,
    -drawParams.drawHeight / 2,
    drawParams.drawWidth,
    drawParams.drawHeight,
  );
  canvasContext.restore();
}

function renderLoop() {
  drawFrame();
  animationFrameId = requestAnimationFrame(renderLoop);
}

function startRender() {
  if (!animationFrameId) {
    renderLoop();
  }
}

function stopRender() {
  if (animationFrameId) {
    cancelAnimationFrame(animationFrameId);
    animationFrameId = null;
  }
  drawFrame();
}

function sendFrame() {
  if (!streaming || !socket || socket.readyState !== WebSocket.OPEN) {
    return;
  }
  // A stalled network must not pile up old frames in the device's memory.
  if (socket.bufferedAmount > MAX_BUFFERED_BYTES) {
    return;
  }
  previewCanvas.toBlob((jpegBlob) => {
    if (jpegBlob && socket && socket.readyState === WebSocket.OPEN) {
      socket.send(jpegBlob);
    }
  }, 'image/jpeg', JPEG_QUALITY);
}

function syncZoomControls() {
  zoomValueLabel.textContent = `${view.zoom.toFixed(1)}x`;
  zoomSlider.value = view.zoom;
}

function syncButtons() {
  mirrorButton.classList.toggle('active', view.mirror);
  fitButton.textContent = view.fit === 'cover' ? t('Crop ✓') : t('Fit ✓');
  syncZoomControls();
}

zoomSlider.oninput = () => {
  view = setZoom(view, parseFloat(zoomSlider.value));
  zoomValueLabel.textContent = `${view.zoom.toFixed(1)}x`;
};
mirrorButton.onclick = () => { view = toggleMirror(view); syncButtons(); };
rotationButton.onclick = () => { view = cycleRotation(view); };
fitButton.onclick = () => { view = toggleFit(view); syncButtons(); };
resetButton.onclick = () => { view = resetView(); syncButtons(); };

const activePointers = new Map();
let lastPanPoint = null;
let pinchStartDistance = 0;
let pinchStartZoom = 1;

const canvasScale = () => CANVAS_WIDTH / previewCanvas.getBoundingClientRect().width;

const pointerDistance = ([first, second]) => Math.hypot(first.x - second.x, first.y - second.y);

previewCanvas.addEventListener('pointerdown', (event) => {
  previewCanvas.setPointerCapture(event.pointerId);
  activePointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
  if (activePointers.size === 1) {
    lastPanPoint = { x: event.clientX, y: event.clientY };
    return;
  }
  if (activePointers.size === 2) {
    pinchStartDistance = pointerDistance([...activePointers.values()]);
    pinchStartZoom = view.zoom;
    lastPanPoint = null;
  }
});

previewCanvas.addEventListener('pointermove', (event) => {
  if (!activePointers.has(event.pointerId)) {
    return;
  }
  activePointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
  if (activePointers.size === 1 && lastPanPoint) {
    const scale = canvasScale();
    view = panBy(
      view,
      (event.clientX - lastPanPoint.x) * scale,
      (event.clientY - lastPanPoint.y) * scale,
    );
    lastPanPoint = { x: event.clientX, y: event.clientY };
    return;
  }
  if (activePointers.size === 2 && pinchStartDistance > 0) {
    const distance = pointerDistance([...activePointers.values()]);
    view = setZoom(view, zoomFromPinch(pinchStartZoom, pinchStartDistance, distance));
    syncZoomControls();
  }
});

function endPointer(event) {
  activePointers.delete(event.pointerId);
  if (activePointers.size === 1) {
    const [remainingPointer] = [...activePointers.values()];
    lastPanPoint = { x: remainingPointer.x, y: remainingPointer.y };
    return;
  }
  if (activePointers.size === 0) {
    lastPanPoint = null;
  }
}

previewCanvas.addEventListener('pointerup', endPointer);
previewCanvas.addEventListener('pointercancel', endPointer);

function activeCameraLabel() {
  const videoTrack = mediaStream && mediaStream.getVideoTracks()[0];
  if (!videoTrack) {
    return t('camera');
  }
  const settings = videoTrack.getSettings ? videoTrack.getSettings() : {};
  return videoTrack.label || settings.facingMode || '?';
}

function cameraListStatusText(cameraCount) {
  if (streaming) {
    return t('{count} camera(s) found - 🟢 streaming', { count: cameraCount });
  }
  return t('{count} camera(s) found', { count: cameraCount });
}

function previewStatusText() {
  if (streaming) {
    return t('🟢 Streaming - {camera}', { camera: activeCameraLabel() });
  }
  return t('👁️ Previewing - {camera}', { camera: activeCameraLabel() });
}

function cameraFailureStatusText(error, revertedStream) {
  const reason = error.name || error.message;
  if (revertedStream) {
    return t('That camera did not open ({reason}). Back to the previous one.', { reason });
  }
  return t('That camera did not open ({reason}). None available.', { reason });
}

async function listCameras() {
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    const cameras = devices.filter((device) => device.kind === 'videoinput');
    const previousDeviceId = cameraSelect.value;
    cameraSelect.innerHTML = '';
    cameras.forEach((camera, index) => {
      const option = document.createElement('option');
      option.value = camera.deviceId;
      option.textContent = camera.label || t('Camera {number}', { number: index + 1 });
      cameraSelect.appendChild(option);
    });
    if (previousDeviceId && cameras.some((camera) => camera.deviceId === previousDeviceId)) {
      cameraSelect.value = previousDeviceId;
    }
    setStatus(cameraListStatusText(cameras.length), cameras.length > 1 ? 'ok' : '');
  } catch {
    // Listing is best effort: without permission the list stays empty and the Back/Front buttons still work.
  }
}

// Camera labels only show up after the permission, and that arrives as a devicechange.
navigator.mediaDevices?.addEventListener?.('devicechange', listCameras);

function stopMediaStream() {
  if (mediaStream) {
    mediaStream.getTracks().forEach((track) => track.stop());
    mediaStream = null;
  }
}

const delay = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));

// Last camera that really opened: where we go back to when a new lens fails.
let wantedVideoConstraint = { facingMode: { ideal: 'environment' } };
let openingCamera = false;

async function revertToLastWorkingCamera() {
  try {
    return await navigator.mediaDevices.getUserMedia({ audio: false, video: wantedVideoConstraint });
  } catch {
    return null;
  }
}

async function attachStream(stream) {
  mediaStream = stream;
  videoSource.srcObject = stream;
  await videoSource.play();
  startRender();
}

// Opens ONE camera at a time: concurrent clicks hold the sensor and break both openings.
async function openCamera(videoConstraint) {
  if (openingCamera) {
    return;
  }
  openingCamera = true;
  const desiredConstraint = videoConstraint || wantedVideoConstraint;
  setStatus(t('Opening camera…'), 'warn');
  try {
    stopMediaStream();
    await delay(CAMERA_RELEASE_DELAY_MS);
    let stream = null;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: desiredConstraint });
      wantedVideoConstraint = desiredConstraint;
    } catch (error) {
      // An auxiliary lens (ultra-wide/tele) often throws NotReadableError when opened by deviceId.
      const revertedStream = await revertToLastWorkingCamera();
      if (revertedStream) {
        await attachStream(revertedStream);
      }
      setStatus(cameraFailureStatusText(error, revertedStream), 'err');
      return;
    }
    await attachStream(stream);
    await listCameras();
    setStatus(previewStatusText(), streaming ? 'ok' : '');
  } finally {
    openingCamera = false;
  }
}

async function startStreaming() {
  if (!mediaStream) {
    await openCamera(wantedVideoConstraint);
  }
  if (!mediaStream) {
    setStatus(t('No camera. Allow access and tap Back/Front'), 'err');
    return;
  }
  socket = new WebSocket(`wss://${location.host}/ws`);
  socket.binaryType = 'blob';
  socket.onopen = () => {
    streaming = true;
    startButton.disabled = true;
    stopButton.disabled = false;
    setStatus(previewStatusText(), 'ok');
    sendTimer = setInterval(sendFrame, 1000 / FPS);
  };
  socket.onclose = () => stopStreaming(t('Connection closed'));
  socket.onerror = () => setStatus(t('WebSocket connection error'), 'err');
}

function stopStreaming(reason) {
  streaming = false;
  if (sendTimer) {
    clearInterval(sendTimer);
    sendTimer = null;
  }
  if (socket) {
    try {
      socket.close();
    } catch {
      // The socket is already dead on disconnect: closing it again changes nothing.
    }
    socket = null;
  }
  stopMediaStream();
  videoSource.srcObject = null;
  stopRender();
  startButton.disabled = false;
  stopButton.disabled = true;
  cameraSelect.disabled = false;
  setStatus(reason || t('Stopped'), 'warn');
}

startButton.onclick = startStreaming;
stopButton.onclick = () => stopStreaming(t('Stopped'));
// facingMode exact always opens the right camera; the lens dropdown is best effort and reverts on its own.
backCameraButton.onclick = () => openCamera({ facingMode: { exact: 'environment' } });
frontCameraButton.onclick = () => openCamera({ facingMode: { exact: 'user' } });
cameraSelect.onchange = () => openCamera({ deviceId: { exact: cameraSelect.value } });

syncButtons();
drawFrame();
if (navigator.mediaDevices?.enumerateDevices) {
  listCameras();
}
</script>
</body>
</html>
